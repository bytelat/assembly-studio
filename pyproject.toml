[project]
name = "assembly-guide"
version = "0.1.0"
description = "Local interactive assembly prototype with reviewed steps and DeepSeek manual analysis"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "pymupdf>=1.25,<2", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
